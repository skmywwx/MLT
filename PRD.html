<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模力通 PRD 阅读器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: #25262b;
      background: #d9d9d9;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .reader-shell {
      width: min(1180px, calc(100vw - 48px));
      height: calc(100vh - 64px);
      min-height: 520px;
      margin: 32px auto;
      display: grid;
      grid-template-columns: 268px minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
    }
    .scroll-pane {
      overflow-y: scroll;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: #c8c9cc transparent;
    }
    .scroll-pane::-webkit-scrollbar { width: 8px; }
    .scroll-pane::-webkit-scrollbar-track { background: transparent; }
    .scroll-pane::-webkit-scrollbar-thumb {
      min-height: 42px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: #c8c9cc;
      background-clip: padding-box;
    }
    .scroll-pane::-webkit-scrollbar-thumb:hover { background-color: #aeb0b4; }
    .panel {
      border: 1px solid #e6e6e6;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 10px 34px rgba(30, 32, 38, .06);
    }
    #tocPane { padding: 28px 16px 34px 20px; }
    .toc-brand {
      position: sticky;
      z-index: 3;
      top: -28px;
      margin: -28px -16px 19px -20px;
      padding: 24px 20px 15px;
      border-bottom: 1px solid #ececef;
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(8px);
    }
    .toc-brand small {
      display: block;
      margin-bottom: 5px;
      color: #00a0df;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .toc-brand strong {
      font-size: 15px;
      letter-spacing: -.2px;
    }
    #toc a {
      position: relative;
      display: block;
      margin: 2px 0;
      padding: 7px 9px;
      overflow: hidden;
      border-radius: 7px;
      color: #6c6e74;
      font-size: 11px;
      line-height: 1.45;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .16s ease, background .16s ease;
    }
    #toc a:hover {
      color: #24252a;
      background: #f2f2f2;
    }
    #toc a.active {
      color: #008fc8;
      background: #eaf8fd;
      font-weight: 600;
    }
    #toc a.active::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 2px;
      border-radius: 2px;
      background: #00a0df;
    }
    #toc a[data-level="3"] { padding-left: 20px; font-size: 10.5px; }
    #toc a[data-level="4"] { padding-left: 31px; font-size: 10px; color: #8a8c91; }
    #contentPane { scroll-behavior: smooth; }
    #content {
      width: min(100%, 840px);
      margin: 0 auto;
      padding: 48px 62px 90px;
      font-size: 13px;
      line-height: 1.8;
    }
    #content h1 {
      margin: 0 0 40px;
      color: #18191d;
      font-size: 30px;
      line-height: 1.25;
      letter-spacing: -1px;
    }
    #content h2 {
      scroll-margin-top: 28px;
      margin: 54px 0 19px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e8e8eb;
      color: #1e1f23;
      font-size: 21px;
      line-height: 1.4;
      letter-spacing: -.45px;
    }
    #content h3 {
      scroll-margin-top: 28px;
      margin: 34px 0 13px;
      color: #292a2f;
      font-size: 16px;
      line-height: 1.5;
    }
    #content h4 {
      scroll-margin-top: 28px;
      margin: 25px 0 11px;
      color: #33343a;
      font-size: 14px;
      line-height: 1.5;
    }
    #content p { margin: 10px 0; color: #4f5157; }
    #content ul, #content ol { margin: 10px 0; padding-left: 23px; color: #4f5157; }
    #content li { margin: 5px 0; }
    #content blockquote {
      margin: 16px 0;
      padding: 10px 14px;
      border-left: 3px solid #00a0df;
      border-radius: 0 7px 7px 0;
      background: #f2fafd;
    }
    #content blockquote p { margin: 0; }
    #content table {
      width: 100%;
      margin: 16px 0 24px;
      border-spacing: 0;
      border-collapse: separate;
      overflow: hidden;
      border: 1px solid #e1e2e5;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.55;
    }
    #content th, #content td {
      padding: 9px 10px;
      border-right: 1px solid #e8e9eb;
      border-bottom: 1px solid #e8e9eb;
      text-align: left;
      vertical-align: top;
    }
    #content th { background: #f6f6f7; color: #33343a; font-weight: 600; }
    #content tr:last-child td { border-bottom: 0; }
    #content th:last-child, #content td:last-child { border-right: 0; }
    #content code {
      border-radius: 4px;
      background: #f0f0f2;
      padding: 2px 5px;
      color: #5559cf;
      font-size: .9em;
    }
    #content pre {
      margin: 16px 0 24px;
      overflow-x: auto;
      border-radius: 9px;
      background: #24252b;
      padding: 16px;
      color: #eff0f3;
      font-size: 11px;
      line-height: 1.65;
    }
    #content pre code { padding: 0; background: transparent; color: inherit; }
    #content a { color: #008fc8; text-decoration: none; }
    #content a:hover { text-decoration: underline; }
    .loading {
      display: grid;
      min-height: 100%;
      place-items: center;
      color: #8a8c91;
      font-size: 12px;
    }
    @media (max-width: 760px) {
      .reader-shell {
        width: calc(100vw - 24px);
        height: calc(100vh - 24px);
        margin: 12px;
        grid-template-columns: 190px minmax(520px, 1fr);
        gap: 12px;
      }
      #content { padding: 38px 34px 70px; }
    }
  </style>
</head>
<body>
  <main class="reader-shell" aria-label="PRD 双栏阅读器">
    <aside id="tocPane" class="panel scroll-pane" aria-label="PRD 目录">
      <div class="toc-brand">
        <small>MIDU PRD</small>
        <strong>文档目录</strong>
      </div>
      <nav id="toc"></nav>
    </aside>
    <article id="contentPane" class="panel scroll-pane" aria-label="PRD 正文">
      <div id="content" class="loading">正在加载 PRD…</div>
    </article>
  </main>

  <script>
    const content = document.querySelector("#content");
    const contentPane = document.querySelector("#contentPane");
    const toc = document.querySelector("#toc");

    function slugify(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/[“”‘’【】《》。，、：；！？（）()[\]{}"'`~!@#$%^&*+=|\\/<>?]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
    }

    async function loadDocument() {
      try {
        const response = await fetch("./PRD.md", { cache: "no-store" });
        if (!response.ok) throw new Error("PRD.md 加载失败");
        let markdown = await response.text();

        // 双栏阅读版使用独立目录，正文中移除 Markdown 自带目录。
        markdown = markdown.replace(/\n## 目录[\s\S]*?(?=\n## 0\. 文档信息)/, "");
        content.classList.remove("loading");
        content.innerHTML = marked.parse(markdown);

        const used = new Map();
        const headings = [...content.querySelectorAll("h2, h3, h4")];
        headings.forEach((heading) => {
          const base = slugify(heading.textContent);
          const count = used.get(base) || 0;
          used.set(base, count + 1);
          heading.id = count ? `${base}-${count}` : base;

          const link = document.createElement("a");
          link.href = `#${heading.id}`;
          link.dataset.level = heading.tagName.slice(1);
          link.textContent = heading.textContent;
          link.addEventListener("click", (event) => {
            event.preventDefault();
            heading.scrollIntoView({ behavior: "smooth", block: "start" });
            history.replaceState(null, "", `#${heading.id}`);
          });
          toc.appendChild(link);
        });

        const links = [...toc.querySelectorAll("a")];
        const observer = new IntersectionObserver((entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          links.forEach((link) => link.classList.toggle(
            "active",
            link.getAttribute("href") === `#${visible.target.id}`
          ));
          const active = toc.querySelector("a.active");
          if (active) active.scrollIntoView({ block: "nearest" });
        }, { root: contentPane, rootMargin: "-5% 0px -82% 0px", threshold: 0 });
        headings.forEach((heading) => observer.observe(heading));

        const initialId = decodeURIComponent(location.hash.slice(1));
        if (initialId) {
          const target = document.getElementById(initialId);
          if (target) requestAnimationFrame(() => target.scrollIntoView());
        }
      } catch (error) {
        content.innerHTML = `<div><strong>无法加载 PRD.md</strong><p>${error.message}。请通过本地服务器打开此页面。</p></div>`;
      }
    }

    loadDocument();
  </script>
</body>
</html>
