<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模力通 PRD 阅读器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: #25262b;
      background: #d9d9d9;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .reader-shell {
      width: min(1680px, calc(100vw - 48px));
      height: calc(100vh - 64px);
      min-height: 520px;
      margin: 32px auto;
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
    }
    .scroll-pane {
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-gutter: stable both-edges;
      scrollbar-width: thin;
      scrollbar-color: #b8b9bd #ececed;
    }
    .scroll-pane::-webkit-scrollbar { width: 10px; }
    .scroll-pane::-webkit-scrollbar-track {
      background: #ececed;
      border-radius: 0;
    }
    .scroll-pane::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 2px solid #ececed;
      border-radius: 999px;
      background: #b8b9bd;
    }
    .scroll-pane::-webkit-scrollbar-thumb:hover { background: #9ea0a5; }
    .panel {
      height: 100%;
      min-height: 0;
      border: 1px solid #e6e6e6;
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 10px 34px rgba(30, 32, 38, .06);
    }
    #tocPane { padding: 0; }
    .toc-brand {
      position: sticky;
      z-index: 3;
      top: 0;
      padding: 24px 18px 14px;
      border-bottom: 1px solid #ececef;
      background: rgba(255, 255, 255, .98);
      backdrop-filter: blur(8px);
    }
    .toc-brand small {
      display: block;
      margin-bottom: 8px;
      color: #00a0df;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .toc-brand strong {
      font-size: 20px;
      letter-spacing: -.2px;
    }
    #toc {
      padding: 14px 12px 28px 16px;
    }
    #toc a {
      position: relative;
      display: block;
      margin: 3px 0;
      padding: 10px 12px;
      overflow: hidden;
      border-radius: 8px;
      color: #6c6e74;
      font-size: 14px;
      line-height: 1.45;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .16s ease, background .16s ease;
    }
    #toc a:hover {
      color: #24252a;
      background: #f2f2f2;
    }
    #toc a.active {
      color: #008fc8;
      background: #eaf8fd;
      font-weight: 600;
    }
    #toc a.active::before {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      left: 0;
      width: 2px;
      border-radius: 2px;
      background: #00a0df;
    }
    #toc a[data-level="3"] { padding-left: 28px; font-size: 14px; }
    #toc a[data-level="4"] { padding-left: 42px; font-size: 13px; color: #8a8c91; }
    #contentPane { scroll-behavior: smooth; }
    #content {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 64px 72px 110px;
      font-size: 17px;
      line-height: 1.8;
    }
    #content h1 {
      margin: 0 0 48px;
      color: #18191d;
      font-size: 39px;
      line-height: 1.25;
      letter-spacing: -1px;
    }
    #content h2 {
      scroll-margin-top: 36px;
      margin: 64px 0 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid #e8e8eb;
      color: #1e1f23;
      font-size: 27px;
      line-height: 1.4;
      letter-spacing: -.45px;
    }
    #content h3 {
      scroll-margin-top: 36px;
      margin: 40px 0 16px;
      color: #292a2f;
      font-size: 21px;
      line-height: 1.5;
    }
    #content h4 {
      scroll-margin-top: 36px;
      margin: 30px 0 14px;
      color: #33343a;
      font-size: 18px;
      line-height: 1.5;
    }
    #content p { margin: 14px 0; color: #4f5157; }
    #content ul, #content ol {
      margin: 14px 0;
      padding-left: 34px;
      color: #4f5157;
    }
    #content li { margin: 8px 0; }
    #content ul { list-style-type: disc; }
    #content ul ul { list-style-type: circle; margin-top: 8px; }
    #content ul ul ul { list-style-type: square; }
    #content ol { list-style-type: decimal; }
    #content ol ol { list-style-type: lower-alpha; margin-top: 8px; }
    #content ol ol ol { list-style-type: lower-roman; }
    #content li::marker { color: #008fc8; font-weight: 600; }
    #content ol > li::marker { color: #00a0df; font-weight: 700; }
    #content blockquote {
      margin: 16px 0;
      padding: 10px 14px;
      border-left: 3px solid #00a0df;
      border-radius: 0 7px 7px 0;
      background: #f2fafd;
    }
    #content blockquote p { margin: 0; }
    #content table {
      width: 100%;
      margin: 20px 0 30px;
      border-spacing: 0;
      border-collapse: separate;
      overflow: hidden;
      border: 1px solid #e1e2e5;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.55;
    }
    #content th, #content td {
      padding: 14px 16px;
      border-right: 1px solid #e8e9eb;
      border-bottom: 1px solid #e8e9eb;
      text-align: left;
      vertical-align: top;
    }
    #content th { background: #f6f6f7; color: #33343a; font-weight: 600; }
    #content tr:last-child td { border-bottom: 0; }
    #content th:last-child, #content td:last-child { border-right: 0; }
    #content code {
      border-radius: 4px;
      background: #f0f0f2;
      padding: 2px 5px;
      color: #5559cf;
      font-size: .9em;
    }
    #content pre {
      margin: 20px 0 30px;
      overflow-x: auto;
      border-radius: 9px;
      background: #24252b;
      padding: 22px;
      color: #eff0f3;
      font-size: 14px;
      line-height: 1.65;
    }
    #content pre code { padding: 0; background: transparent; color: inherit; }
    #content a { color: #008fc8; text-decoration: none; }
    #content a:hover { text-decoration: underline; }
    .loading {
      display: grid;
      min-height: 100%;
      place-items: center;
      color: #8a8c91;
      font-size: 16px;
    }
    @media (max-width: 760px) {
      .reader-shell {
        width: calc(100vw - 24px);
        height: calc(100vh - 24px);
        margin: 12px;
        grid-template-columns: 280px minmax(640px, 1fr);
        gap: 12px;
      }
      #content { padding: 48px 40px 80px; font-size: 14px; }
    }
  </style>
</head>

        .toLowerCase()
        .replace(/[“”‘’【】《》。，、：；！？（）()[\]{}"'`~!@#$%^&*+=|\\/<>?]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
    }

    function stripReaderSections(markdown) {
      return markdown
        .replace(/\n## 目录[\s\S]*?(?=\n## 0\. 文档信息)/, "")
        .replace(/^> \[打开双栏独立滚动阅读版\]\(\.\/PRD\.html\)[^\n]*\n\n/, "");
    }

    function decodeBase64Utf8(value) {
      const bytes = Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      return new TextDecoder("utf-8").decode(bytes);
    }

    async function resolveMarkdown() {
      const embedded = embeddedMarkdown?.textContent?.trim();
      if (embedded) {
        return decodeBase64Utf8(embedded);
      }
      if (location.protocol === "file:") {
        throw new Error("内嵌 PRD 内容为空。请先运行 python3 scripts/sync-prd-html.py 同步 PRD.md。");
      }
      const response = await fetch("./PRD.md", { cache: "no-store" });
      if (!response.ok) throw new Error("PRD.md 加载失败");
      return stripReaderSections(await response.text());
    }

    async function loadDocument() {
      try {
        const markdown = await resolveMarkdown();
        content.classList.remove("loading");
        content.innerHTML = marked.parse(markdown);

        const used = new Map();
        const headings = [...content.querySelectorAll("h2, h3, h4")];
        headings.forEach((heading) => {
          const base = slugify(heading.textContent);
          const count = used.get(base) || 0;
          used.set(base, count + 1);
          heading.id = count ? `${base}-${count}` : base;

          const link = document.createElement("a");
          link.href = `#${heading.id}`;
          link.dataset.level = heading.tagName.slice(1);
          link.textContent = heading.textContent;
          link.addEventListener("click", (event) => {
            event.preventDefault();
            heading.scrollIntoView({ behavior: "smooth", block: "start" });
            history.replaceState(null, "", `#${heading.id}`);
          });
          toc.appendChild(link);
        });

        const links = [...toc.querySelectorAll("a")];
        const observer = new IntersectionObserver((entries) => {
          const visible = entries
            .filter((entry) => entry.isIntersecting)
            .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
          if (!visible) return;
          links.forEach((link) => link.classList.toggle(
            "active",
            link.getAttribute("href") === `#${visible.target.id}`
          ));
          const active = toc.querySelector("a.active");
          if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }, { root: contentPane, rootMargin: "-5% 0px -82% 0px", threshold: 0 });
        headings.forEach((heading) => observer.observe(heading));

        const initialId = decodeURIComponent(location.hash.slice(1));
        if (initialId) {
          const target = document.getElementById(initialId);
          if (target) requestAnimationFrame(() => target.scrollIntoView());
        }
      } catch (error) {
        content.innerHTML = `<div><strong>无法加载 PRD 内容</strong><p>${error.message}</p><p>请先修改 <code>PRD.md</code>，再执行 <code>python3 scripts/sync-prd-html.py</code> 同步到本页面。</p></div>`;
      }
    }

    [tocPane, contentPane].forEach((pane) => {
      pane.addEventListener("wheel", (event) => event.stopPropagation(), { passive: true });
    });

    loadDocument();
  </script>
</body>
</html>
