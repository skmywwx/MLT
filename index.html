            brand: { DEFAULT: '#BFE1F2', dark: '#8ECAE6', light: '#E8F6FC', ink: '#1E3A4C' },

    * { font-family: 'Inter', system-ui, sans-serif; }

    .postcard-slot { aspect-ratio: 4/3; }
    .canvas-dot { width: 8px; height: 8px; border-radius: 50%; background: #BFE1F2; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #c5d8e3; border-radius: 3px; }

  <script>
    // ─── State ───────────────────────────────────────────────
    const STORAGE_KEY = 'theme_album_photos_v1';
    let photos = [];
    let galleryTab = 'all';
    let viewMode = 'grid';
    let currentFolderId = null;
    let folderDisplayMode = 'folder';
    let postcardPage = 0;

    const folders = [
      { id: 'f1', title: '2025 京都之旅', photoIds: [], cover: 'https://images.unsplash.com/photo-1493976040374-85c8e912f137?w=400&q=80', count: 12 },
      { id: 'f2', title: '夏日海边', photoIds: [], cover: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80', count: 8 },
    ];

    const albums = [
      { id: 'a1', title: '京都 Zine 手账', pages: 6, updated: '2025-08-12', status: 'draft' },
    ];

    const samplePhotos = [
      { id: 's1', url: 'https://images.unsplash.com/photo-1493976040374-85c8e912f137?w=600&q=80', name: '京都塔.jpg', takenDate: '2025-03-15', takenTime: '14:32', location: '京都, 日本', importedDate: '2025-08-10' },
      { id: 's2', url: 'https://images.unsplash.com/photo-1545569341-9f8ffb085801?w=600&q=80', name: '伏见稻荷.jpg', takenDate: '2025-03-16', takenTime: '09:15', location: '伏见稻荷大社', importedDate: '2025-08-10' },
      { id: 's3', url: 'https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=600&q=80', name: '街景.jpg', takenDate: '2025-03-16', takenTime: '18:40', location: '祇园', importedDate: '2025-08-11' },
      { id: 's4', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80', name: '海滩.jpg', takenDate: '2025-07-20', takenTime: '17:00', location: '三亚', importedDate: '2025-08-12' },
    ];

    // ─── Init ────────────────────────────────────────────────
    function loadPhotos() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        photos = saved ? JSON.parse(saved) : [...samplePhotos];
      } catch { photos = [...samplePhotos]; }
      updateStats();
    }

    function savePhotos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
      updateStats();
    }

    function updateStats() {
      document.getElementById('statPhotos').textContent = photos.length;
      document.getElementById('worksPhotoCount').textContent = photos.length;
      document.getElementById('statAlbums').textContent = albums.length;
    }

    // ─── Navigation ──────────────────────────────────────────
    const views = { home: 'view-home', works: 'view-works', gallery: 'view-gallery', album: 'view-album' };

    function navigate(view, opts = {}) {
      Object.values(views).forEach(id => document.getElementById(id).classList.remove('active'));
      document.getElementById(views[view]).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.nav === view);
      });
      if (view === 'gallery') {
        if (opts.tab) galleryTab = opts.tab;
        if (opts.folderId) { currentFolderId = opts.folderId; galleryTab = 'folders'; }
        renderGallery();
      }
      if (view === 'album' && opts.editor) showAlbumEditor();
      else if (view === 'album') showAlbumList();
    }

    document.querySelectorAll('[data-nav]').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.nav));
    });

    document.querySelectorAll('[data-go]').forEach(btn => {
      btn.addEventListener('click', () => navigate(btn.dataset.go));
    });

    document.getElementById('goFolders').addEventListener('click', () => navigate('gallery', { tab: 'folders' }));

    // ─── Gallery ─────────────────────────────────────────────
    document.querySelectorAll('.gallery-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        galleryTab = btn.dataset.galleryTab;
        currentFolderId = null;
        folderDisplayMode = 'folder';
        renderGallery();
      });
    });

    document.querySelectorAll('.view-mode').forEach(btn => {
      btn.addEventListener('click', () => {
        viewMode = btn.dataset.view;
        document.querySelectorAll('.view-mode').forEach(b => {
          b.classList.toggle('bg-white', b.dataset.view === viewMode);
          b.classList.toggle('shadow-sm', b.dataset.view === viewMode);
          b.classList.toggle('text-slate-400', b.dataset.view !== viewMode);
        });
        renderGallery();
      });
    });

    document.querySelectorAll('.folder-mode').forEach(btn => {
      btn.addEventListener('click', () => {
        folderDisplayMode = btn.dataset.folderMode;
        document.querySelectorAll('.folder-mode').forEach(b => {
          const on = b.dataset.folderMode === folderDisplayMode;
          b.classList.toggle('bg-white', on);
          b.classList.toggle('shadow-sm', on);
          b.classList.toggle('text-brand-ink', on);
          b.classList.toggle('text-slate-500', !on);
        });
        renderGallery();
      });
    });

    document.getElementById('backToFolders').addEventListener('click', () => {
      currentFolderId = null;
      folderDisplayMode = 'folder';
      renderGallery();
    });

    function getFolderPhotos(fid) {
      const folder = folders.find(f => f.id === fid);
      if (!folder) return photos.slice(0, folder?.count || 4);
      return photos.slice(0, Math.min(folder.count, photos.length)) || samplePhotos.slice(0, 4);
    }

    function renderGallery() {
      const tabs = document.getElementById('galleryTabs');
      const modeToggle = document.getElementById('viewModeToggle');
      const folderModeToggle = document.getElementById('folderModeToggle');
      const detailBar = document.getElementById('folderDetailBar');
      const allPanel = document.getElementById('galleryAll');
      const foldersPanel = document.getElementById('galleryFolders');
      const postcardPanel = document.getElementById('galleryPostcard');

      document.querySelectorAll('.gallery-tab').forEach(b => {
        const on = b.dataset.galleryTab === galleryTab && !currentFolderId;
        b.classList.toggle('bg-white', on);
        b.classList.toggle('shadow-sm', on);
        b.classList.toggle('text-brand-ink', on);
        b.classList.toggle('text-slate-500', !on);
      });

      if (currentFolderId) {
        tabs.classList.add('hidden');
        detailBar.classList.remove('hidden');
        folderModeToggle.classList.remove('hidden');
        const folder = folders.find(f => f.id === currentFolderId);
        document.getElementById('currentFolderName').textContent = folder?.title || '';

        if (folderDisplayMode === 'postcard') {
          allPanel.classList.add('hidden');
          foldersPanel.classList.add('hidden');
          postcardPanel.classList.remove('hidden');
          modeToggle.classList.add('hidden');
          renderPostcard();
        } else {
          postcardPanel.classList.add('hidden');
          allPanel.classList.remove('hidden');
          foldersPanel.classList.add('hidden');
          modeToggle.classList.remove('hidden');
          renderPhotos(getFolderPhotos(currentFolderId));
        }
        document.getElementById('gallerySubtitle').textContent = folder?.title + ' · 主题文件夹';
        return;
      }

      tabs.classList.remove('hidden');
      detailBar.classList.add('hidden');
      folderModeToggle.classList.add('hidden');
      postcardPanel.classList.add('hidden');
      modeToggle.classList.remove('hidden');

      if (galleryTab === 'all') {
        allPanel.classList.remove('hidden');
        foldersPanel.classList.add('hidden');
        document.getElementById('gallerySubtitle').textContent = '全部照片 · 本地上传';
        renderPhotos(photos);
      } else {
        allPanel.classList.add('hidden');
        foldersPanel.classList.remove('hidden');
        document.getElementById('gallerySubtitle').textContent = '主题文件夹';
        renderFolderGrid();
      }
    }

    function renderPhotos(list) {
      const grid = document.getElementById('photoGrid');
      const listEl = document.getElementById('photoList');
      const empty = document.getElementById('emptyGallery');
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = list.filter(p =>
        !q || p.name?.toLowerCase().includes(q) || p.location?.toLowerCase().includes(q)
      );

      if (!filtered.length) {
        grid.innerHTML = '';
        listEl.innerHTML = '';
        empty.classList.remove('hidden');
        grid.classList.toggle('hidden', viewMode === 'list');
        listEl.classList.toggle('hidden', viewMode === 'grid');
        return;
      }
      empty.classList.add('hidden');

      if (viewMode === 'grid') {
        grid.classList.remove('hidden');
        listEl.classList.add('hidden');
        grid.innerHTML = filtered.map(p => `
          <div class="group relative aspect-square rounded-xl overflow-hidden bg-slate-100 border border-slate-200/80 shadow-soft">
            <img src="${p.url}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy"/>
            <div class="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/50 to-transparent opacity-0 group-hover:opacity-100 transition">
              <p class="text-white text-xs truncate">${p.name}</p>
            </div>
          </div>`).join('');
      } else {
        listEl.classList.remove('hidden');
        grid.classList.add('hidden');
        listEl.innerHTML = filtered.map(p => `
          <div class="flex items-center gap-4 p-3 rounded-xl bg-white border border-slate-200/80 hover:border-brand/50 transition">
            <img src="${p.url}" class="w-14 h-14 rounded-lg object-cover shrink-0" alt=""/>
            <div class="min-w-0 flex-1">
              <div class="font-medium text-sm truncate">${p.name}</div>
              <div class="text-xs text-slate-400 mt-0.5">${p.takenDate} ${p.takenTime} · ${p.location}</div>
            </div>
            <div class="text-xs text-slate-400 shrink-0">导入 ${p.importedDate}</div>
          </div>`).join('');
      }
    }

    function renderFolderGrid() {
      document.getElementById('folderGrid').innerHTML = folders.map(f => `
        <button data-folder="${f.id}" class="text-left rounded-2xl overflow-hidden bg-white border border-slate-200/80 hover:border-brand shadow-soft hover:shadow-card transition group">
          <div class="aspect-[16/10] overflow-hidden bg-brand-light">
            <img src="${f.cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt=""/>
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-brand-ink">${f.title}</h3>
            <p class="text-xs text-slate-400 mt-1">${f.count} 张照片</p>
          </div>
        </button>`).join('');

      document.querySelectorAll('[data-folder]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFolderId = btn.dataset.folder;
          postcardPage = 0;
          renderGallery();
        });
      });
    }

    function renderPostcard() {
      const fps = getFolderPhotos(currentFolderId);
      const perPage = 2;
      const totalPages = Math.max(1, Math.ceil(fps.length / perPage));
      postcardPage = Math.min(postcardPage, totalPages - 1);
      const slice = fps.slice(postcardPage * perPage, postcardPage * perPage + perPage);

      document.getElementById('postcardPageInfo').textContent = `第 ${postcardPage + 1} / ${totalPages} 页`;
      document.getElementById('postcardSpread').innerHTML = slice.map(p => `
        <div class="space-y-2">
          <div class="text-xs text-slate-500 space-y-0.5">
            <div>${p.takenDate} · ${p.takenTime}</div>
            <div>${p.location}</div>
          </div>
          <div class="postcard-slot rounded-lg overflow-hidden border border-slate-200 bg-slate-50 shadow-inner">
            <img src="${p.url}" class="w-full h-full object-cover" alt=""/>
          </div>
          <div class="text-[11px] text-slate-400">导入 ${p.importedDate}</div>
        </div>`).join('') + (slice.length === 1 ? '<div class="hidden md:block"></div>' : '');

      document.getElementById('postcardPrev').onclick = () => { if (postcardPage > 0) { postcardPage--; renderPostcard(); } };
      document.getElementById('postcardNext').onclick = () => { if (postcardPage < totalPages - 1) { postcardPage++; renderPostcard(); } };
    }

    function renderWorksFolders() {
      document.getElementById('worksFolderList').innerHTML = folders.map(f => `
        <button data-open-folder="${f.id}" class="flex gap-3 p-3 rounded-xl bg-white border border-slate-200/80 hover:border-brand text-left transition">
          <img src="${f.cover}" class="w-16 h-16 rounded-lg object-cover shrink-0"/>
          <div><div class="font-medium text-sm">${f.title}</div><div class="text-xs text-slate-400">${f.count} 张</div></div>
        </button>`).join('');
      document.querySelectorAll('[data-open-folder]').forEach(b => {
        b.addEventListener('click', () => navigate('gallery', { folderId: b.dataset.openFolder }));
      });
    }

    // ─── Album ───────────────────────────────────────────────
    function renderAlbums() {
      document.getElementById('albumCards').innerHTML = albums.map(a => `
        <button data-edit-album="${a.id}" class="text-left p-5 rounded-2xl bg-white border border-slate-200/80 hover:border-brand shadow-soft hover:shadow-card transition">
          <div class="aspect-[4/3] rounded-xl bg-gradient-to-br from-brand-light to-white border border-brand/30 mb-4 flex items-center justify-center">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="6" width="32" height="36" rx="2" stroke="#8ECAE6" stroke-width="1.5"/><line x1="14" y1="14" x2="34" y2="14" stroke="#BFE1F2"/><line x1="14" y1="20" x2="28" y2="20" stroke="#BFE1F2"/></svg>
          </div>
          <h3 class="font-semibold text-brand-ink">${a.title}</h3>
          <p class="text-xs text-slate-400 mt-1">${a.pages} 页 · 草稿 · 更新于 ${a.updated}</p>
        </button>`).join('') + `
        <button id="createAlbumCard" class="p-5 rounded-2xl border-2 border-dashed border-brand/50 hover:bg-brand-light/30 transition flex flex-col items-center justify-center min-h-[200px] text-brand-ink">
          <span class="text-2xl mb-2">+</span><span class="text-sm font-medium">新建电子相册</span>
        </button>`;

      document.querySelectorAll('[data-edit-album]').forEach(b => {
        b.addEventListener('click', () => showAlbumEditor());
      });
      document.getElementById('createAlbumCard')?.addEventListener('click', () => showAlbumEditor());
    }

    function showAlbumList() {
      document.getElementById('albumListView').classList.remove('hidden');
      document.getElementById('albumEditorView').classList.add('hidden');
      renderAlbums();
    }

    function showAlbumEditor() {
      document.getElementById('albumListView').classList.add('hidden');
      document.getElementById('albumEditorView').classList.remove('hidden');
    }

    document.getElementById('createAlbumBtn').addEventListener('click', showAlbumEditor);
    document.getElementById('backToAlbumList').addEventListener('click', showAlbumList);
    document.getElementById('previewAlbumBtn').addEventListener('click', () => {
      document.getElementById('previewModal').classList.remove('hidden');
    });
    document.getElementById('closePreview').addEventListener('click', () => {
      document.getElementById('previewModal').classList.add('hidden');
    });

    // ─── Upload ──────────────────────────────────────────────
    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', e => {
      const files = [...e.target.files];
      const now = new Date();
      const importedDate = now.toISOString().slice(0, 10);
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = ev => {
          photos.unshift({
            id: 'u' + Date.now() + Math.random().toString(36).slice(2),
            url: ev.target.result,
            name: file.name,
            takenDate: importedDate,
            takenTime: now.toTimeString().slice(0, 5),
            location: '未知地点',
            importedDate,
          });
          loaded++;
          if (loaded === files.length) {
            savePhotos();
            if (document.getElementById('view-gallery').classList.contains('active')) renderGallery();
          }
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    });

    // ─── Search ──────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', () => {
      if (document.getElementById('view-gallery').classList.contains('active')) renderGallery();
    });

    // ─── Chart ───────────────────────────────────────────────
    function initChart() {
      const ctx = document.getElementById('activityChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
          datasets: [
            { label: '上传照片', data: [2, 5, 3, 8, 4, 6, 3], backgroundColor: '#BFE1F2', borderRadius: 6 },
            { label: '编辑相册', data: [0, 1, 2, 1, 3, 2, 1], backgroundColor: '#8ECAE6', borderRadius: 6 },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter' }, boxWidth: 12 } } },
          scales: {
            y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { stepSize: 2 } },
            x: { grid: { display: false } },
          },
        },
      });
    }

    // ─── Boot ────────────────────────────────────────────────
    loadPhotos();
    renderWorksFolders();
    renderAlbums();
    initChart();
    navigate('home');
  </script>
</body>
</html>
