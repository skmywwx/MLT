<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI智能体 首页｜模力通</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2308a5ec'/%3E%3Cpath d='M8 10h16v9H14l-5 4 1-4H8z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: "#5B5FE5", navy: "#143c78" },
          boxShadow: {
            composer: "0 8px 22px rgba(30, 35, 55, .08)",
            card: "0 1px 3px rgba(31, 46, 71, .05)"
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: #30343b;
      background: #f3f4f6;
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      overflow: hidden;
    }
    button, a, [role="button"] {
      transition: color .18s ease, background-color .18s ease,
        border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    button:active, [role="button"]:active { transform: scale(.97); }
    .nav-scroll::-webkit-scrollbar { width: 4px; }
    .nav-scroll::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 10px; }
    .nav-item.is-selected,
    .nav-item.is-selected:hover {
      color: #171717;
      background: #ebebeb;
      font-weight: 700;
    }
    .nav-item:hover {
      color: #171717 !important;
      background: #f1f1f1 !important;
    }
    .recent-row {
      position: relative;
      border-radius: 8px;
    }
    .recent-row:hover { background: #f1f1f1; }
    .recent-row .delete-conversation {
      opacity: 0;
      pointer-events: none;
      transform: translateX(3px);
    }
    .recent-row:hover .delete-conversation,
    .recent-row:focus-within .delete-conversation {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }
    .attach-menu {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);
      transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
    }
    .attach-menu-wrap:hover .attach-menu,
    .attach-menu-wrap:focus-within .attach-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .attach-menu-wrap:hover #attach,
    .attach-menu-wrap:focus-within #attach {
      color: #303030;
      background: #f0f0f0;
      border-color: #c9c9c9;
    }
    .agent-card:hover {
      border-color: #b9bbf6;
      box-shadow: 0 7px 20px rgba(91, 95, 229, .10);
      transform: translateY(-2px);
    }
    .avatar-art {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #e7f7ff, #d9eef9);
    }
    .avatar-art::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: -7px;
      height: 15px;
      border-radius: 50%;
      background: #6aaed5;
      opacity: .55;
    }
    .speech-logo {
      filter: drop-shadow(0 5px 9px rgba(8, 165, 236, .18));
    }
    .app-shell {
      width: calc(100vw - 4px);
      height: calc(100vh - 4px);
      min-height: 560px;
      margin: 2px;
      border-radius: 6px;
    }
    .main-stage { min-width: 650px; }
    .toast { animation: toastIn .25s ease-out; }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @media (max-width: 760px) {
      #sidebar { width: 176px; }
      .hero-inner { width: min(92%, 563px); }
      .agent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-title { font-size: 27px; }
    }
  </style>
</head>
<body>
  <div class="app-shell overflow-hidden bg-white border border-[#d4d6da]">
    <header class="h-[45px] border-b border-[#eceff2] flex items-center justify-between px-[21px] bg-white">
      <button class="flex items-center gap-[6px] group" title="返回模力通首页">
        <span class="text-[25px] leading-none italic font-extrabold tracking-[-2px] text-[#08a5ec] group-hover:text-brand">midu</span>
        <span class="h-[20px] border-l border-[#a6a6a6]"></span>
        <span class="font-semibold text-[16px] text-[#323232] group-hover:text-brand">模力通</span>
      </button>
      <div class="flex items-center gap-[17px] text-[#53575c]">
        <button class="hover:text-brand hover:bg-indigo-50 rounded p-1.5" title="任务中心"><i data-lucide="notebook-pen" class="w-[16px] h-[16px]"></i></button>
        <button class="hover:text-brand hover:bg-indigo-50 rounded p-1.5" title="产品中心"><i data-lucide="layers-3" class="w-[16px] h-[16px]"></i></button>
        <button class="w-[27px] h-[27px] rounded-full bg-[#0b9ed6] text-white grid place-items-center hover:bg-brand hover:shadow-md" title="应用菜单">
          <i data-lucide="grip" class="w-[15px] h-[15px]"></i>
        </button>
        <button class="w-[27px] h-[27px] rounded-full bg-[#1596ca] text-white text-[12px] font-semibold hover:bg-brand hover:shadow-md" title="个人中心">蜜</button>
      </div>
    </header>

    <div class="flex h-[calc(100%-45px)]">
      <aside id="sidebar" class="w-[205px] shrink-0 bg-[#fafafa] border-r border-[#e9ecef] flex flex-col px-[9px] py-[14px] pb-[15px]">
        <nav class="nav-scroll flex-1 overflow-y-auto">
          <button data-nav class="nav-item is-selected w-full h-[28px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
            <i data-lucide="command" class="w-[13px] h-[13px]"></i><span>办公写作Agent</span>
          </button>
          <div class="space-y-[1px] mt-[5px]">
            <button data-nav class="nav-item w-full h-[31px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
              <i data-lucide="file-text" class="w-[13px] h-[13px]"></i><span>AI公文写作</span>
            </button>
            <button data-nav class="nav-item w-full h-[31px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
              <i data-lucide="files" class="w-[13px] h-[13px]"></i><span>AI内容审核</span>
            </button>
            <button data-nav class="nav-item w-full h-[31px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
              <i data-lucide="shield-check" class="w-[13px] h-[13px]"></i><span>AI公文校对</span>
            </button>
            <button data-nav class="nav-item w-full h-[31px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
              <i data-lucide="clipboard-pen-line" class="w-[13px] h-[13px]"></i><span>AI会议纪要</span>
            </button>
            <button data-nav class="nav-item w-full h-[31px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
              <i data-lucide="message-circle-question" class="w-[13px] h-[13px]"></i><span>AI知识问答</span>
            </button>
            <button data-nav class="nav-item w-full h-[31px] px-[9px] rounded-[7px] flex items-center gap-[9px] text-left hover:bg-[#eeeefe] hover:text-brand">
              <i data-lucide="library" class="w-[13px] h-[13px]"></i><span>资料库</span>
            </button>
          </div>

          <div class="mt-[10px]">
            <div class="flex items-center justify-between px-[9px] text-[#999] text-[10px]">
              <span>最近对话</span>
              <button id="viewAll" aria-label="查看全部对话" class="text-[#8b8f95] hover:text-brand hover:bg-indigo-50 rounded p-1"><i data-lucide="chevron-right" class="w-[11px] h-[11px]"></i></button>
            </div>
            <div id="recentList" class="mt-[4px] space-y-[1px]">
              <div class="recent-row group flex items-center">
                <button class="min-w-0 flex-1 text-left truncate pl-[9px] pr-[30px] h-[29px]">请将以上文档内容整合，并整...</button>
                <button class="delete-conversation absolute right-[7px] w-[22px] h-[22px] rounded grid place-items-center text-[#8a8a8a] hover:text-[#333]" aria-label="删除对话" title="删除">
                  <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7.5 7 8.5 20h7L16.5 7"/></svg>
                </button>
              </div>
              <div class="recent-row group flex items-center">
                <button class="min-w-0 flex-1 text-left truncate pl-[9px] pr-[30px] h-[29px]">请根据最近中式婚礼潮流，生...</button>
                <button class="delete-conversation absolute right-[7px] w-[22px] h-[22px] rounded grid place-items-center text-[#8a8a8a] hover:text-[#333]" aria-label="删除对话" title="删除">
                  <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7.5 7 8.5 20h7L16.5 7"/></svg>
                </button>
              </div>
              <div class="recent-row group flex items-center">
                <button class="min-w-0 flex-1 text-left truncate pl-[9px] pr-[30px] h-[29px]">请生成一份中式，大约预算5W...</button>
                <button class="delete-conversation absolute right-[7px] w-[22px] h-[22px] rounded grid place-items-center text-[#8a8a8a] hover:text-[#333]" aria-label="删除对话" title="删除">
                  <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7.5 7 8.5 20h7L16.5 7"/></svg>
                </button>
              </div>
            </div>
          </div>
        </nav>

        <div class="h-[35px] rounded-[8px] bg-[#f5f5f5] grid grid-cols-2 p-[3px]">
          <button class="relative flex items-center justify-center gap-[5px] rounded-[6px] text-[#686d72] hover:bg-white hover:text-brand hover:shadow-sm after:absolute after:right-0 after:h-[13px] after:border-r after:border-[#dedede]">
            <i data-lucide="book-open" class="w-[12px] h-[12px]"></i>知识库
          </button>
          <button class="flex items-center justify-center gap-[5px] rounded-[6px] text-[#686d72] hover:bg-white hover:text-brand hover:shadow-sm">
            <i data-lucide="folder" class="w-[12px] h-[12px]"></i>文件库
          </button>
        </div>
      </aside>

      <main class="main-stage relative flex-1 bg-white overflow-y-auto overflow-x-hidden">
        <button id="benefits" class="absolute top-[9px] right-[9px] h-[22px] px-[8px] rounded-full flex items-center gap-[4px] text-[#159bd2] bg-[#f2fbff] hover:bg-[#eeeeff] hover:text-brand hover:shadow-sm">
          <i data-lucide="badge-check" class="w-[12px] h-[12px]"></i>权益详情
        </button>

        <section class="hero-inner w-[563px] mx-auto pt-[57px] pb-[26px]">
          <div class="hero-title h-[74px] flex justify-center items-center gap-[18px] text-[31px] text-[#12366d] font-serif tracking-[1px]">
            <span>一句话交代</span>
            <div class="speech-logo relative w-[49px] h-[49px]">
              <div class="absolute right-0 top-0 w-[38px] h-[38px] rounded-full border-[6px] border-[#dff3ff] border-b-[#72c9f6] rotate-[-23deg]"></div>
              <div class="absolute left-[2px] bottom-[2px] w-[34px] h-[27px] rounded-[17px] bg-gradient-to-br from-[#77d2ff] to-[#1c9fe9]">
                <div class="h-full flex justify-center items-center gap-[3px]">
                  <i class="w-[4px] h-[4px] rounded-full bg-white"></i><i class="w-[4px] h-[4px] rounded-full bg-white"></i><i class="w-[4px] h-[4px] rounded-full bg-white"></i>
                </div>
                <span class="absolute left-[4px] bottom-[-3px] w-[9px] h-[9px] bg-[#4fbef7] rotate-[-20deg] rounded-sm"></span>
              </div>
            </div>
            <span>一整套交付</span>
          </div>

          <div class="mt-[13px] h-[97px] rounded-[11px] border border-[#e6e7ea] bg-white shadow-composer p-[10px]">
            <textarea id="prompt" class="w-full h-[43px] resize-none outline-none text-[12px] placeholder:text-[#a6a8ac]" placeholder="请输入内容开始写作"></textarea>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-[5px]">
                <div class="attach-menu-wrap relative">
                  <button id="attach" class="w-[29px] h-[29px] rounded-full border border-[#e1e2e5] grid place-items-center text-[#555] hover:text-[#303030] hover:bg-[#f0f0f0] hover:border-[#c9c9c9]" title="添加内容" aria-haspopup="menu">
                    <i data-lucide="plus" class="w-[17px] h-[17px]"></i>
                  </button>
                  <div class="attach-menu absolute z-30 left-0 top-[36px] w-[145px] rounded-[14px] border border-[#ededed] bg-white p-[7px] shadow-[0_10px_28px_rgba(30,30,30,.15)]" role="menu">
                    <button id="myKnowledge" class="w-full h-[39px] px-[9px] rounded-[9px] flex items-center gap-[12px] text-[13px] text-[#272727] hover:bg-[#f2f2f2]" role="menuitem">
                      <i data-lucide="archive" class="w-[17px] h-[17px]"></i><span>我的知识库</span>
                    </button>
                    <button id="uploadLocal" class="w-full h-[39px] px-[9px] rounded-[9px] flex items-center gap-[12px] text-[13px] text-[#272727] hover:bg-[#f2f2f2]" role="menuitem">
                      <i data-lucide="upload" class="w-[18px] h-[18px]"></i><span>上传本地文件</span>
                    </button>
                  </div>
                </div>
                <button id="modeButton" class="h-[29px] px-[9px] flex items-center gap-[5px] rounded-[8px] border border-[#e6e7ea] bg-white hover:bg-indigo-50 hover:text-brand hover:border-indigo-200">
                  <i data-lucide="command" class="w-[13px] h-[13px]"></i><span id="modeText">智能体</span>
                </button>
                <button id="assistantButton" class="h-[29px] px-[9px] flex items-center gap-[5px] rounded-[8px] border border-[#e6e7ea] bg-white hover:bg-indigo-50 hover:text-brand hover:border-indigo-200">
                  <i data-lucide="monitor" class="w-[12px] h-[12px]"></i>文风助手库
                </button>
              </div>
              <button id="send" class="w-[28px] h-[28px] rounded-full bg-[#d8dadd] text-white grid place-items-center hover:bg-brand hover:shadow-md" title="发送">
                <i data-lucide="arrow-up" class="w-[15px] h-[15px]"></i>
              </button>
            </div>
          </div>

          <div class="mt-[24px] flex justify-center gap-[7px]">
            <button data-suggestion="帮我写一份工作汇报" class="h-[32px] px-[12px] rounded-[14px] border border-[#e8ebee] flex items-center gap-[6px] hover:border-[#b9bbf6] hover:bg-[#f4f4ff] hover:text-brand">
              <i data-lucide="feather" class="w-[13px] h-[13px] text-[#47d632]"></i>写作
            </button>
            <button data-suggestion="深度研究人工智能发展趋势" class="h-[32px] px-[12px] rounded-[14px] border border-[#e8ebee] flex items-center gap-[6px] hover:border-[#b9bbf6] hover:bg-[#f4f4ff] hover:text-brand">
              <i data-lucide="microscope" class="w-[13px] h-[13px] text-[#ff7259]"></i>深度研究
            </button>
            <button data-suggestion="生成一份项目介绍PPT" class="h-[32px] px-[12px] rounded-[14px] border border-[#e8ebee] flex items-center gap-[6px] hover:border-[#b9bbf6] hover:bg-[#f4f4ff] hover:text-brand">
              <i data-lucide="presentation" class="w-[13px] h-[13px] text-[#f07758]"></i>AI PPT
            </button>
          </div>

          <h2 class="mt-[28px] mb-[11px] text-center text-[11px] font-semibold text-[#222]">办公写作智能体：让写作专家团队，为您精修每一篇文章</h2>
          <div class="agent-grid grid grid-cols-3 gap-x-[10px] gap-y-[17px]">
            <button data-agent="写作达人" class="agent-card h-[83px] rounded-[10px] border border-[#e3e5e8] p-[11px] text-left bg-white shadow-card">
              <div class="flex gap-[7px]">
                <div class="avatar-art w-[29px] h-[29px] shrink-0 rounded-[6px] grid place-items-center text-[18px]">👩🏻</div>
                <div class="min-w-0"><h3 class="font-semibold text-[11px]">写作达人</h3><p class="text-[8px] text-[#9a9a9a] mt-[2px] truncate">专业文稿处理与知识提取助手</p></div>
              </div>
              <div class="flex gap-[5px] mt-[7px] text-[8px]"><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">大纲写作</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">极速写作</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">公文写作</span></div>
            </button>
            <button data-agent="统筹专家" class="agent-card h-[83px] rounded-[10px] border border-[#e3e5e8] p-[11px] text-left bg-white shadow-card">
              <div class="flex gap-[7px]">
                <div class="avatar-art w-[29px] h-[29px] shrink-0 rounded-[6px] grid place-items-center text-[18px]">👨🏻‍💼</div>
                <div class="min-w-0"><h3 class="font-semibold text-[11px]">统筹专家</h3><p class="text-[8px] text-[#9a9a9a] mt-[2px] truncate">任务管理专家</p></div>
              </div>
              <div class="flex gap-[5px] mt-[7px] text-[8px]"><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">需求拆解</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">任务规划</span></div>
            </button>
            <button data-agent="检索专家" class="agent-card h-[83px] rounded-[10px] border border-[#e3e5e8] p-[11px] text-left bg-white shadow-card">
              <div class="flex gap-[7px]">
                <div class="avatar-art w-[29px] h-[29px] shrink-0 rounded-[6px] grid place-items-center text-[18px]">🧑🏻‍💻</div>
                <div class="min-w-0"><h3 class="font-semibold text-[11px]">检索专家</h3><p class="text-[8px] text-[#9a9a9a] mt-[2px] truncate">精准信息收集专家</p></div>
              </div>
              <div class="flex gap-[5px] mt-[7px] text-[8px]"><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">信息收集</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">自动刷剧</span></div>
            </button>
            <button data-agent="文献阅读师" class="agent-card h-[83px] rounded-[10px] border border-[#e3e5e8] p-[11px] text-left bg-white shadow-card">
              <div class="flex gap-[7px]">
                <div class="avatar-art w-[29px] h-[29px] shrink-0 rounded-[6px] grid place-items-center text-[18px]">🧑🏻‍🏫</div>
                <div class="min-w-0"><h3 class="font-semibold text-[11px]">文献阅读师</h3><p class="text-[8px] text-[#9a9a9a] mt-[2px] truncate">专业文献处理与知识提取助手</p></div>
              </div>
              <div class="flex gap-[5px] mt-[7px] text-[8px]"><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">信息收集</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">自动刷剧</span></div>
            </button>
            <button data-agent="研究员" class="agent-card h-[83px] rounded-[10px] border border-[#e3e5e8] p-[11px] text-left bg-white shadow-card">
              <div class="flex gap-[7px]">
                <div class="avatar-art w-[29px] h-[29px] shrink-0 rounded-[6px] grid place-items-center text-[18px]">👨🏻‍🔬</div>
                <div class="min-w-0"><h3 class="font-semibold text-[11px]">研究员</h3><p class="text-[8px] text-[#9a9a9a] mt-[2px] truncate">深度研究专家</p></div>
              </div>
              <div class="flex gap-[5px] mt-[7px] text-[8px]"><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">深度研究</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">数据分析</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">图表生成</span></div>
            </button>
            <button data-agent="资深编辑" class="agent-card h-[83px] rounded-[10px] border border-[#e3e5e8] p-[11px] text-left bg-white shadow-card">
              <div class="flex gap-[7px]">
                <div class="avatar-art w-[29px] h-[29px] shrink-0 rounded-[6px] grid place-items-center text-[18px]">👩🏻‍💼</div>
                <div class="min-w-0"><h3 class="font-semibold text-[11px]">资深编辑</h3><p class="text-[8px] text-[#9a9a9a] mt-[2px] truncate">内容校对与风险把控专家</p></div>
              </div>
              <div class="flex gap-[5px] mt-[7px] text-[8px]"><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">文字校对</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">标点校对</span><span class="bg-[#f5f5f5] px-[5px] py-[2px] rounded">知识校对</span></div>
            </button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="menu" class="hidden fixed z-30 w-[128px] rounded-[8px] border border-[#e5e8eb] bg-white shadow-lg p-[5px] text-[12px]">
    <button data-mode="智能体" class="w-full p-[7px] rounded text-left hover:bg-indigo-50 hover:text-brand">智能体团队</button>
    <button data-mode="自动编排" class="w-full p-[7px] rounded text-left hover:bg-indigo-50 hover:text-brand">自动编排</button>
    <button data-mode="指定专家" class="w-full p-[7px] rounded text-left hover:bg-indigo-50 hover:text-brand">指定专家</button>
  </div>

  <div id="modal" class="hidden fixed inset-0 z-40 bg-black/20 backdrop-blur-[1px] items-center justify-center">
    <div class="w-[390px] rounded-[14px] bg-white shadow-2xl border border-[#e7e9ec] p-[20px]">
      <div class="flex items-center justify-between">
        <h3 id="modalTitle" class="font-semibold text-[15px]">权益详情</h3>
        <button id="closeModal" class="w-[28px] h-[28px] rounded-full grid place-items-center hover:bg-[#f0f7fb] hover:text-brand"><i data-lucide="x" class="w-[16px] h-[16px]"></i></button>
      </div>
      <div id="modalBody" class="mt-[14px] text-[#6a6f75] leading-7">
        当前为办公智能体体验版，已包含写作、研究、会议纪要和文档阅读能力。
      </div>
      <button id="modalOkay" class="mt-[16px] w-full h-[36px] rounded-[8px] bg-brand text-white hover:bg-[#494dcc] hover:shadow-md">我知道了</button>
    </div>
  </div>
  <div id="toast" class="hidden toast fixed z-50 left-1/2 top-[60px] -translate-x-1/2 px-[16px] py-[9px] rounded-[8px] bg-[#263542] text-white shadow-xl text-[12px]"></div>

  <script>
    lucide.createIcons();

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => [...document.querySelectorAll(selector)];
    const promptBox = $("#prompt");
    const menu = $("#menu");
    const modal = $("#modal");
    let toastTimer;

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 2200);
    }

    function openModal(title, content) {
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = content;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    $("#benefits").addEventListener("click", () => openModal("权益详情",
      "当前为办公智能体体验版，已包含写作、研究、会议纪要和文档阅读能力。<br><span class='text-brand'>今日剩余智能任务：18 次</span>"));
    $("#closeModal").addEventListener("click", closeModal);
    $("#modalOkay").addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(); });

    $("#modeButton").addEventListener("click", (event) => {
      const rect = event.currentTarget.getBoundingClientRect();
      menu.style.left = rect.left + "px";
      menu.style.top = rect.bottom + 5 + "px";
      menu.classList.toggle("hidden");
    });
    $$("[data-mode]").forEach(button => button.addEventListener("click", () => {
      $("#modeText").textContent = button.dataset.mode;
      menu.classList.add("hidden");
      showToast("已切换为" + button.dataset.mode);
    }));
    document.addEventListener("click", (event) => {
      if (!menu.contains(event.target) && !$("#modeButton").contains(event.target)) menu.classList.add("hidden");
    });

    $("#assistantButton").addEventListener("click", () => openModal("文风助手",
      "<div class='grid grid-cols-2 gap-2'>" +
      ["正式严谨", "简洁清晰", "亲切自然", "创意生动"].map(x =>
        `<button onclick="selectStyle('${x}')" class="border border-[#e4e8eb] rounded-lg py-2 hover:border-sky-300 hover:bg-sky-50 hover:text-brand">${x}</button>`
      ).join("") + "</div>"));
    window.selectStyle = (style) => { closeModal(); showToast("已选择“" + style + "”文风"); };

    $("#myKnowledge").addEventListener("click", () => showToast("已打开我的知识库"));
    $("#uploadLocal").addEventListener("click", () => showToast("已打开本地文件选择器（原型演示）"));
    $("#viewAll").addEventListener("click", () => openModal("全部对话",
      "<div class='space-y-2'>" +
      ["2025年终总结报告撰写", "十五五会议的重点有哪些？", "季度工作计划优化", "项目会议纪要整理"].map(x =>
        `<button class="w-full text-left px-3 py-2 rounded bg-[#f7f8f9] hover:bg-sky-50 hover:text-brand">${x}</button>`
      ).join("") + "</div>"));

    $$("[data-suggestion]").forEach(button => button.addEventListener("click", () => {
      promptBox.value = button.dataset.suggestion;
      promptBox.focus();
    }));

    $$("[data-agent]").forEach(button => button.addEventListener("click", () => {
      promptBox.value = "请让" + button.dataset.agent + "帮我完成：";
      promptBox.focus();
      showToast("已选择智能体：" + button.dataset.agent);
    }));

    $$("[data-nav]").forEach(button => button.addEventListener("click", () => {
      $$(".nav-item").forEach(item => item.classList.remove("is-selected"));
      button.classList.add("is-selected");
      if (!button.textContent.includes("办公写作Agent")) showToast(button.textContent.trim() + " 功能即将打开");
    }));

    $("#recentList").addEventListener("click", (event) => {
      const deleteButton = event.target.closest(".delete-conversation");
      if (!deleteButton) return;
      event.stopPropagation();
      deleteButton.closest(".recent-row").remove();
      showToast("对话已删除");
    });

    function createRecentRow(text) {
      const row = document.createElement("div");
      row.className = "recent-row group flex items-center";
      row.innerHTML = `
        <button class="min-w-0 flex-1 text-left truncate pl-[9px] pr-[30px] h-[29px]"></button>
        <button class="delete-conversation absolute right-[7px] w-[22px] h-[22px] rounded grid place-items-center text-[#8a8a8a] hover:text-[#333]" aria-label="删除对话" title="删除">
          <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 7h14"/><path d="M9 7V4h6v3"/><path d="M7.5 7 8.5 20h7L16.5 7"/></svg>
        </button>`;
      row.querySelector("button").textContent = text;
      return row;
    }

    function submitPrompt() {
      const text = promptBox.value.trim();
      if (!text) {
        promptBox.focus();
        showToast("请先输入要交代的任务");
        return;
      }
      $("#recentList").prepend(createRecentRow(text));
      lucide.createIcons();
      promptBox.value = "";
      showToast("任务已提交，智能体团队正在协作");
    }
    $("#send").addEventListener("click", submitPrompt);
    promptBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        submitPrompt();
      }
    });

    // Chart.js is loaded per prototype requirements and ready for future data views.
    window.prototypeChartLibrary = Chart;
  </script>
</body>
</html>
